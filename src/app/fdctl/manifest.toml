# Frankendancer (fdctl) link manifest.
#
# Lists links exposed to plugins for version compatibility
# checking.  Internal links are omitted — only cross-boundary
# links need entries.
#
# Versions use semver.  A version covers the full link
# contract: payload struct layout and signal/control schema.
# Size parameters (depth, mtu, burst) are not versioned.

[[produces]]
link    = "plugin_out"
version = "1.0.0"
mtu     = 17160120 # FD_STAKE_OUT_MTU

